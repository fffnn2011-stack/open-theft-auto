name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"
          yes | sdkmanager --licenses || true

      - name: Configure Godot Android settings
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Android export preset if missing
        shell: bash
        run: |
          if ! grep -q 'platform="Android"' export_presets.cfg 2>/dev/null; then

            cp export_presets.cfg export_presets.cfg.backup 2>/dev/null || true

            cat >> export_presets.cfg <<'EOF'

          [preset.99]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/OpenTheftAuto.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.99.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.ayman.opentheftauto"
          package/name="Open Theft Auto"
          package/signed=false
          package/app_category=0
          EOF

          fi

      - name: Import Godot project
        run: |
          timeout 60 godot \
            --headless \
            --path . \
            --editor \
            --quit || true

      - name: Build Android APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-release "Android" \
            build/OpenTheftAuto.apk

      - name: Check APK
        run: |
          ls -lh build/
          test -f build/OpenTheftAuto.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTheftAuto-Android
          path: build/OpenTheftAuto.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Open Theft Auto Android Build ${{ github.run_number }}
          files: build/OpenTheftAuto.apk
          generate_release_notes: true
